<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5"/>
  
  <!-- Sudoku 3x3 Mini Grid Frame -->
  <g filter="url(#shadow)">
    <!-- Outer Grid Box -->
    <rect x="96" y="96" width="320" height="320" rx="32" fill="#18181b" stroke="#475569" stroke-width="6"/>
    
    <!-- Grid Lines (Sub-divisions) -->
    <line x1="202" y1="96" x2="202" y2="416" stroke="#334155" stroke-width="4"/>
    <line x1="310" y1="96" x2="310" y2="416" stroke="#334155" stroke-width="4"/>
    <line x1="96" y1="202" x2="416" y2="202" stroke="#334155" stroke-width="4"/>
    <line x1="96" y1="310" x2="416" y2="310" stroke="#334155" stroke-width="4"/>
    
    <!-- Selected Focus Cell in Center -->
    <rect x="206" y="206" width="100" height="100" rx="14" fill="#312e81" fill-opacity="0.4" stroke="#6366f1" stroke-width="4"/>
    
    <!-- Stylized Numbers -->
    <text x="149" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="300" fill="#f8fafc" text-anchor="middle">5</text>
    <text x="256" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="300" fill="#94a3b8" text-anchor="middle">3</text>
    <text x="363" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="300" fill="#f8fafc" text-anchor="middle">7</text>
    
    <text x="149" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="300" fill="#94a3b8" text-anchor="middle">6</text>
    <text x="256" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="700" fill="url(#accent-grad)" text-anchor="middle">9</text>
    <text x="363" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="300" fill="#f8fafc" text-anchor="middle">1</text>
    
    <text x="149" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="300" fill="#f8fafc" text-anchor="middle">8</text>
    <text x="256" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="300" fill="#94a3b8" text-anchor="middle">4</text>
    <text x="363" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="300" fill="#f8fafc" text-anchor="middle">2</text>
  </g>
</svg>
